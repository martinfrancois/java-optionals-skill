name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch release PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr list \
            --state open \
            --head release-please--branches--main--components--java-optionals \
            --json title,headRefName \
            --jq '.[0] // empty')"

          if [ -z "$pr_json" ]; then
            echo "No open release PR to check."
            exit 0
          fi

          title="$(printf '%s\n' "$pr_json" | jq -r '.title')"
          branch="$(printf '%s\n' "$pr_json" | jq -r '.headRefName')"

          gh workflow run ci.yml --ref "$branch"
          gh workflow run commitlint.yml --ref "$branch" \
            -f pr_title="$title" \
            -f base_ref=main
